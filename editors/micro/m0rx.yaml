filetype: m0rx
detect:
  filename: "\\.mrx$"
rules:
  - keyword: "\\b(if|else|elif|match|when|loop|while|each|break|skip|give|halt|fn|class|let|async|await|try|catch|panic|mod|use)\\b"
  - type: "\\b(tiny|short|ant|long|vast|half|dbl|precise|str|txt|bool|nil|list|map|set|blob|tensor)\\b"
  - constant: "\\b(true|false|null|void)\\b"
  - comment: "//.*$"
  - string: "\"[^\"]*\""
  - number: "\\b[0-9]+(\\.[0-9]+)?\\b"
