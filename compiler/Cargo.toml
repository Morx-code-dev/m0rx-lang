[package]
name = "morxc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "morxc"
path = "src/main.rs"

[dependencies]
logos = "0.14"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
colored = "2"
